[project]
name = "mcfast"
version = "0.1.0"
description = "Browser-based OpenFAST input deck editor and 3D viewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "openfast-io>=4.1.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.1",
]

[project.scripts]
mcfast = "mcfast.cli:main"
mcfast-run = "mcfast.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcfast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
